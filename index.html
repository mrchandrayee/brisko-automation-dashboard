<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>brisko — Automation workspace</title><link rel="stylesheet" href="styles.css"></head><body>
<div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><span class="brand-icon">✦</span><b>brisko</b></div><div class="workspace"><span class="workspace-avatar">T</span><span>Tallow &amp; Fern<small>Workspace</small></span><span>⌄</span></div><nav id="sideNav"></nav><div class="sidefoot"><button data-page="Help">ⓘ　Help</button><button data-page="Settings">⚙　Settings</button><button id="collapse">⇤　Collapse</button><div class="profile"><span class="user">NH</span><span>Noor Haddad<small>Owner</small></span><b>•••</b></div></div></aside>
<main class="main"><header class="topbar"><div class="crumb" id="crumb">Tallow &amp; Fern　⌄</div><div class="search"><span>⌕</span><input id="globalSearch" placeholder="Search scenarios, runs, people..."><kbd>⌘ K</kbd></div><div class="top-actions"><button id="activity">◷</button><button id="notifications">♧<i></i></button><button id="topProfile">◉</button><button class="new" id="newScenario">＋ New scenario</button></div></header><section id="content"></section></main></div>
<div class="toast" id="toast"></div><div class="modalwrap" id="modal"><form class="modal" id="scenarioForm"><button type="button" class="x" id="closeModal">×</button><div class="eyebrow">AUTOMATION BUILDER</div><h2>Create a scenario</h2><p>Start with a clear event and choose what should happen next.</p><label>Scenario name<input id="scenarioName" required placeholder="e.g. New order → packing slip"></label><label>Folder<select id="scenarioFolder"><option>Orders</option><option>Finance</option><option>Customers</option><option>Inventory</option><option>Operations</option></select></label><label>Trigger<select id="scenarioTrigger"><option>New order</option><option>New customer</option><option>Schedule</option><option>Webhook event</option></select></label><div class="modal-actions"><button type="button" class="ghost" id="cancel">Cancel</button><button class="primary">Create scenario ↗</button></div></form></div>
<script src="app.js"></script></body></html>
